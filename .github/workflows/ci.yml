name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check circle_bundles/ tests/

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

  distribution:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build and check distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Install and import the wheel outside the checkout
        run: |
          python -m pip install dist/*.whl
          cd /tmp
          python -c "import circle_bundles; print(circle_bundles.__version__)"

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install documentation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[docs]"

      - name: Build documentation with warnings as errors
        env:
          SPHINX_OFFLINE: "1"
        run: |
          sphinx-build -W --keep-going -T -b html docs docs/_build/html

  notebooks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install notebook environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[notebooks]"

      - name: Execute self-contained tutorials
        env:
          MPLBACKEND: Agg
        run: |
          mkdir -p /tmp/circle-bundles-notebooks
          for notebook in notebooks/tutorials/all/*.ipynb; do
            case "$notebook" in
              *04_optical_flow_torus.ipynb) continue ;;
            esac
            jupyter nbconvert "$notebook" \
              --to notebook \
              --execute \
              --ExecutePreprocessor.kernel_name=python3 \
              --ExecutePreprocessor.timeout=900 \
              --output "$(basename "$notebook")" \
              --output-dir /tmp/circle-bundles-notebooks
          done
